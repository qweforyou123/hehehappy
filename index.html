<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Blake</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--W:min(44vw,calc(66dvh*.707));--H:calc(var(--W)/.707);--ink:#4a2c1a}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#c9a477;background-image:radial-gradient(ellipse at 30% 20%,rgba(255,235,200,.45),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(110,70,30,.35),transparent 55%),repeating-linear-gradient(47deg,rgba(120,80,40,.05) 0 2px,transparent 2px 5px);
display:flex;flex-direction:column;align-items:center;overflow:hidden;font-family:'Caveat','Segoe Script',cursive;color:var(--ink);padding-top:max(6dvh,env(safe-area-inset-top,0px))}
#stage{perspective:2200px;width:100%;display:flex;justify-content:center}
#book{position:relative;width:calc(var(--W)*2);height:var(--H);transform-style:preserve-3d;transform:translateX(calc(var(--W)/-2));transition:transform 1.1s cubic-bezier(.5,0,.2,1)}
#book.open{transform:translateX(0)}
.right{position:absolute;left:50%;top:0;width:50%;height:100%;background:#a98 center/100% 100% no-repeat;box-shadow:0 10px 30px rgba(60,30,10,.45);overflow:hidden}
.fl{position:absolute;transform-origin:50% 100%;transition:opacity .35s;pointer-events:none;will-change:transform}
.fl.out{opacity:0}
.cover{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.5,0,.2,1)}
.open .cover{transform:rotateY(-180deg)}
.f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 10px 30px rgba(60,30,10,.45)}
.front{background:center/100% 100% no-repeat;cursor:pointer}
.open .front{pointer-events:none}
.back{transform:rotateY(180deg);background-color:#f3e6cf;background-image:linear-gradient(90deg,rgba(190,40,40,.55) 50%,transparent 50%),linear-gradient(rgba(190,40,40,.55) 50%,transparent 50%);background-size:8% 5.6%}
.panel{position:absolute;inset:4%;background:#f6eedd;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.slot{position:absolute;inset:0 0 6% 0;overflow:hidden}
.eb,.ef{position:absolute;left:5%;width:90%;height:40%;bottom:0}
.eb{background:#b87d48;z-index:1}
.ef{background:#dba46a;clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%);z-index:3;filter:drop-shadow(0 -2px 3px rgba(0,0,0,.3))}
.letter{position:absolute;left:10%;width:80%;top:44%;z-index:2;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.35);transition:top .7s cubic-bezier(.3,.8,.3,1),z-index 0s .35s;display:block}
.letter.up{top:7%;z-index:5;transition:top .7s cubic-bezier(.3,.8,.3,1),z-index 0s 0s;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.tip{position:absolute;left:0;right:0;bottom:9%;text-align:center;z-index:4;font-size:calc(var(--W)*.06);pointer-events:none;color:#fff8;text-shadow:0 1px 2px #0006}
.wish{position:absolute;left:0;right:0;top:12%;text-align:center;font-size:calc(var(--W)*.11);color:#fff;text-shadow:0 2px 6px #000a,0 0 18px #c0305a;opacity:0;transform:scale(.8);transition:all .7s;pointer-events:none;padding:0 5%}
.wish.show{opacity:1;transform:none}
#bar{margin-top:2.2dvh;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .6s .8s;padding:0 12px;max-width:100%}
.open~#bar,body.o #bar{opacity:1;pointer-events:auto}
button{font:inherit;font-size:1.15rem;background:#f6eedd;color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:6px 14px;cursor:pointer;box-shadow:2px 3px 0 var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:active{transform:translate(1px,2px);box-shadow:1px 1px 0 var(--ink)}
#relight{display:none}
.meter{width:110px;height:12px;border:2px solid var(--ink);border-radius:8px;background:#f6eedd;overflow:hidden}
#lvl{height:100%;width:0;background:linear-gradient(90deg,#4a9,#ec3,#d33)}
#status{width:100%;text-align:center;font-size:1.05rem}
#conf{position:fixed;inset:0;pointer-events:none;z-index:50}
</style></head><body>

const $=s=>document.querySelector(s),book=$('#book'),rp=$('#rp'),letter=$('#letter'),tip=$('#tip'),st=$('#status');
let mic=0,hold=false,lv=0,blow=0,lit=true,ac,an,buf,stream;
const fl=FL.map((f,i)=>{const e=new Image();e.src=f.src;e.className='fl';e.style.cssText=`left:${f.l}%;top:${f.t}%;width:${f.w}%;height:${f.h}%`;rp.appendChild(e);return{e,i,out:false,t:[.45,.5,.55][i%3]}});
const wish=document.createElement('div');wish.className='wish';wish.textContent='make a wish, '+NAME+' \u2728';rp.appendChild(wish);
function setO(o){book.classList.toggle('open',o);document.body.classList.toggle('o',o)}
$('#front').onclick=()=>{setO(true);startMic()};
$('#back').onclick=()=>{setO(false);letter.classList.remove('up');tip.style.opacity=1;stopMic()};
letter.onclick=e=>{e.stopPropagation();const u=letter.classList.toggle('up');tip.style.opacity=u?0:1;tip.textContent=u?'':'tap the letter'};
async function startMic(){
 if(stream)return;
 if(!navigator.mediaDevices||!window.isSecureContext){st.textContent='Mic needs https \u2014 hold the button or Space to blow.';return}
 try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
 ac=new(window.AudioContext||window.webkitAudioContext)();await ac.resume();const s=ac.createMediaStreamSource(stream);an=ac.createAnalyser();an.fftSize=1024;s.connect(an);buf=new Float32Array(an.fftSize);
 st.textContent='Mic on \u2014 blow on the candles!'}catch(e){stream=null;st.textContent='Mic blocked \u2014 hold the button or Space to blow.'}}
function stopMic(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(ac){ac.close();ac=null}an=null;mic=0}
const H=$('#hold');['pointerdown'].forEach(n=>H.addEventListener(n,e=>{e.preventDefault();hold=true}));
['pointerup','pointerleave','pointercancel'].forEach(n=>H.addEventListener(n,()=>hold=false));
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();hold=true}});
addEventListener('keyup',e=>{if(e.code==='Space')hold=false});
$('#relight').onclick=()=>{fl.forEach(f=>{f.out=false;f.e.classList.remove('out')});blow=0;lit=true;wish.classList.remove('show');$('#relight').style.display='none'};
let last=performance.now();
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(an){an.getFloatTimeDomainData(buf);let s=0;for(const v of buf)s+=v*v;mic=Math.min(1,Math.sqrt(s/buf.length)*7)}
 const tgt=Math.max(mic,hold?.75:0);lv+=(tgt-lv)*.35;
 $('#lvl').style.width=(lv*100)+'%';
 if(lit&&book.classList.contains('open')){
  blow=lv>.3?blow+dt:Math.max(0,blow-dt*1.5);
  fl.forEach(f=>{if(!f.out&&blow>=f.t){f.out=true;f.e.classList.add('out')}});
  if(fl.every(f=>f.out)){lit=false;wish.classList.add('show');$('#relight').style.display='';confetti()}}
 fl.forEach(f=>{if(f.out)return;const k=now/1000*7+f.i*2,fk=Math.sin(k)*2+Math.sin(k*2.3)*1.2;
  f.e.style.transform=`rotate(${fk+lv*60}deg) scale(${1-lv*.15},${1-lv*.25+Math.sin(k*1.7)*.03})`});
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
function confetti(){
 const c=$('#conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const cols=['#e8b','#fd5','#6ad','#a5d','#e55','#5c9','#f93'];
 const P=Array.from({length:170},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:Math.random()*4-2,vy:Math.random()*3+2,r:Math.random()*6.3,vr:Math.random()*.3-.15,w:6+Math.random()*7,c:cols[Math.random()*7|0]}));
 let n=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);x.restore()});
 if(++n<320)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
</script></body></html>
